# Ескі Reels-ті пробный етіп қайта салу (lib/repost.js). Алматы 08–23; әр run ~55 мин минут сайын тексереді.
name: repost
on:
  schedule:
    - cron: '*/30 3-18 * * *'
  workflow_dispatch:
concurrency: repost
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node scripts/repost-run.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_ENC_KEY: ${{ secrets.TOKEN_ENC_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_IDS: ${{ secrets.TG_CHAT_IDS }}
